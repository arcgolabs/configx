name: Release

on:
  push:
    tags:
      - "v*"
      - "**/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.4.0 or format/hcl/v0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${REQUESTED_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ (^|/)v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be vX.Y.Z or module/path/vX.Y.Z, got '$tag'"
            exit 1
          fi

          if [[ "$tag" == */v* ]]; then
            module="${tag%/*}"
            version="${tag##*/}"
            title="${module} ${version}"
          else
            title="configx ${tag}"
          fi

          {
            echo "tag=${tag}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release for $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TITLE"
